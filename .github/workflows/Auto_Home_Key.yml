name: Auto Home Key Generator

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      account:
        description: 'Number of Accounts to be generated (default = 0)'
        required: false
        default: '0'
        type: string
      key:
        description: 'Number of Keys to be generated (default = 1)'
        required: false
        default: '1'
        type: string
      mail:
        description: 'Choose the mail provider to generate license'
        required: true
        type: choice
        options:
          - emailfake
          - fakemail
          - inboxes
        default: emailfake
      key_type:
        description: 'Modes of operation'
        required: true
        type: choice
        options:
          - --key
          - --small-business-key
        default: --key
      os:
        description: 'Operating System of runner (Linux, macOS, Windows)'
        required: true
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        default: ubuntu-latest
      branch:
        description: "Repository branch (don't touch it if you don't know what it is!!!)"
        required: false
        type: choice
        options:
          - main
          - test
        default: main

permissions:
  contents: read

concurrency:
  group: auto-home-key-gen
  cancel-in-progress: false

jobs:
  generate-account-and-key:
    # Same default as manual: ubuntu-latest. If manual run picks another OS, it is used.
    runs-on: ${{ github.event.inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      # Single fallback chain used for BOTH manual and scheduled runs.
      - name: Set Variables
        id: vars
        shell: bash
        run: |
          ACCOUNT="${{ github.event.inputs.account || '0' }}"
          KEY="${{ github.event.inputs.key || '1' }}"
          MAIL="${{ github.event.inputs.mail || 'emailfake' }}"
          KEY_TYPE="${{ github.event.inputs.key_type || '--key' }}"
          BRANCH="${{ github.event.inputs.branch || 'main' }}"

          echo "account=$ACCOUNT"     >> "$GITHUB_OUTPUT"
          echo "key=$KEY"             >> "$GITHUB_OUTPUT"
          echo "mail=$MAIL"           >> "$GITHUB_OUTPUT"
          echo "key_type=$KEY_TYPE"   >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"       >> "$GITHUB_OUTPUT"

      - name: Clone Repository
        run: git clone -b "${{ steps.vars.outputs.branch }}" https://github.com/Shariful797/E-S-ET-K-Gen.git

      - name: Setup & Run Script (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TOKEN: ${{ secrets.TOKEN }}
          ACCOUNT: ${{ steps.vars.outputs.account }}
          KEY: ${{ steps.vars.outputs.key }}
          MAIL: ${{ steps.vars.outputs.mail }}
          KEY_TYPE: ${{ steps.vars.outputs.key_type }}
        run: |
          cd E-S-ET-K-Gen

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install python@3.14 || true
          else
            sudo apt update
            sudo apt install -y python3-pip python3-venv
          fi

          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          if [[ "$ACCOUNT" != "0" ]]; then
            python main.py --auto-detect-browser --account --email-api "$MAIL" --token "$TOKEN" --skip-update-check --no-logo --disable-progress-bar --disable-logging --repeat "$ACCOUNT"
            {
              echo "Account:"
              cat ./*ACCOUNTS.txt 2>/dev/null || echo "None"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$KEY" != "0" ]]; then
            python main.py --auto-detect-browser "$KEY_TYPE" --email-api "$MAIL" --token "$TOKEN" --skip-update-check --no-logo --disable-progress-bar --disable-logging --repeat "$KEY"
            {
              echo ""
              echo "Key:"
              cat ./*KEYS.txt 2>/dev/null || echo "None"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup & Run Script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TOKEN: ${{ secrets.TOKEN }}
          ACCOUNT: ${{ steps.vars.outputs.account }}
          KEY: ${{ steps.vars.outputs.key }}
          MAIL: ${{ steps.vars.outputs.mail }}
          KEY_TYPE: ${{ steps.vars.outputs.key_type }}
        run: |
          cd E-S-ET-K-Gen

          python -m venv venv
          .\venv\Scripts\python -m pip install --upgrade pip
          .\venv\Scripts\pip install -r requirements.txt

          if ("$env:ACCOUNT" -ne "0") {
            .\venv\Scripts\python main.py --auto-detect-browser --account --email-api "$env:MAIL" --token "$env:TOKEN" --skip-update-check --no-logo --disable-progress-bar --disable-logging --repeat "$env:ACCOUNT"
            "Account:" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $files = Get-ChildItem -Path . -Filter "*ACCOUNTS.txt" -ErrorAction SilentlyContinue
            if ($files) { $files | Get-Content | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
            else        { "None"    | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          }

          if ("$env:KEY" -ne "0") {
            .\venv\Scripts\python main.py --auto-detect-browser "$env:KEY_TYPE" --email-api "$env:MAIL" --token "$env:TOKEN" --skip-update-check --no-logo --disable-progress-bar --disable-logging --repeat "$env:KEY"
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "Key:" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $files = Get-ChildItem -Path . -Filter "*KEYS.txt" -ErrorAction SilentlyContinue
            if ($files) { $files | Get-Content | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
            else        { "None"    | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          }
